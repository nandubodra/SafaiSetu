package com.safaisetu.service;

import com.safaisetu.model.Complaint;
import com.safaisetu.repository.ComplaintRepository;
import org.springframework.stereotype.Service;

import java.util.List;

@Service
public class DuplicateComplaintService {

    private final ComplaintRepository complaintRepository;

    public DuplicateComplaintService(ComplaintRepository complaintRepository) {
        this.complaintRepository = complaintRepository;
    }

    public Complaint findLikelyDuplicate(Double latitude, Double longitude, String category) {
        if (latitude == null || longitude == null || category == null) {
            return null;
        }

        List<Complaint> complaints = complaintRepository.findAll();
        for (Complaint complaint : complaints) {
            if (complaint.getCategory() == null || !complaint.getCategory().equalsIgnoreCase(category)) {
                continue;
            }

            double latDiff = Math.abs(complaint.getLatitude() - latitude);
            double lngDiff = Math.abs(complaint.getLongitude() - longitude);

            if (latDiff < 0.01 && lngDiff < 0.01) {
                return complaint;
            }
        }

        return null;
    }
}
